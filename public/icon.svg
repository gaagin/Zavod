<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Industrial Grid circuit lines -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="2">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Factory building silhouette & SCADA Node diagram -->
  <!-- Workshop container shape -->
  <rect x="96" y="112" width="320" height="288" rx="28" fill="#1E293B" fill-opacity="0.8" stroke="url(#cyanGrad)" stroke-width="6" />

  <!-- Factory Roofline -->
  <path d="M128 176 L184 128 L184 176 L240 128 L240 176 L296 128 L296 176 L352 128 L352 208" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Machine Core (Gear / Processor) -->
  <circle cx="256" cy="276" r="56" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="276" r="28" fill="url(#amberGrad)" />

  <!-- SCADA Connection links -->
  <path d="M168 320 L220 290" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6" />
  <path d="M344 320 L292 290" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />

  <!-- Node Dots (Equipment sensors) -->
  <circle cx="160" cy="328" r="16" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="352" cy="328" r="16" fill="#0284C7" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="256" cy="180" r="12" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />

  <!-- Status indicator pulse -->
  <circle cx="396" cy="120" r="14" fill="#10B981" />
  <circle cx="396" cy="120" r="24" fill="none" stroke="#10B981" stroke-width="3" opacity="0.6" />
</svg>
